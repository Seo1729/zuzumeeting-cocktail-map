<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
    body { margin: 0; }
    a { color: #e8b45c; }
    a:hover { color: #f0c479; }
    .b-scroll::-webkit-scrollbar { display: none; }
  </style>
</helmet>

<!--
  지금 배포되어 있는 리스트 화면을 그대로 옮긴 것. 비교 기준으로만 둔다.
  값은 src/index.css의 @theme과 각 컴포넌트의 Tailwind 클래스에서 그대로 가져왔다.
-->
<div style="width: 390px; height: 844px; overflow: hidden; background: #0b0b0f; color: #f2f2f5; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;">

  <div style="padding: 24px 16px 12px 16px;">
    <div style="font-size: 22px; font-weight: 700; line-height: 1.3;">전주 칵테일바</div>
    <div style="margin-top: 4px; font-size: 15px; color: #a1a1ae;">전북대 칵테일 동아리 · 대학로 / 객사 / 신시가지</div>
  </div>

  <div style="padding: 0 16px 12px 16px;">
    <div style="width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid #2c2c38; background: #16161d; padding: 12px 48px 12px 16px; font-size: 16px; color: #a1a1ae;">바 이름, 분위기, 한 줄 평으로 검색</div>
  </div>

  <div class="b-scroll" style="display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 8px 16px; scrollbar-width: none;">
    <div style="flex-shrink: 0; border-radius: 9999px; border: 1px solid #e8b45c; background: #e8b45c; color: #2a1d06; padding: 10px 16px; font-size: 15px; font-weight: 500; white-space: nowrap;">전체</div>
    <div style="flex-shrink: 0; border-radius: 9999px; border: 1px solid #2c2c38; background: #16161d; color: #a1a1ae; padding: 10px 16px; font-size: 15px; font-weight: 500; white-space: nowrap;">대학로</div>
    <div style="flex-shrink: 0; border-radius: 9999px; border: 1px solid #2c2c38; background: #16161d; color: #a1a1ae; padding: 10px 16px; font-size: 15px; font-weight: 500; white-space: nowrap;">객사</div>
    <div style="flex-shrink: 0; border-radius: 9999px; border: 1px solid #2c2c38; background: #16161d; color: #a1a1ae; padding: 10px 16px; font-size: 15px; font-weight: 500; white-space: nowrap;">신시가지</div>
  </div>

  <div class="b-scroll" style="display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 8px 16px; scrollbar-width: none;">
    <div style="flex-shrink: 0; border-radius: 9999px; border: 1px solid #2c2c38; background: #16161d; color: #a1a1ae; padding: 10px 16px; font-size: 15px; font-weight: 500; white-space: nowrap;">입문자 추천만</div>
    <div style="flex-shrink: 0; border-radius: 9999px; border: 1px solid #e8b45c; background: #e8b45c; color: #2a1d06; padding: 10px 16px; font-size: 15px; font-weight: 500; white-space: nowrap;">가격 전체</div>
    <div style="flex-shrink: 0; border-radius: 9999px; border: 1px solid #2c2c38; background: #16161d; color: #a1a1ae; padding: 10px 16px; font-size: 15px; font-weight: 500; white-space: nowrap;">1.3만원 이하</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;">
    <div style="font-size: 15px; color: #a1a1ae;">11곳</div>
    <div style="display: flex; gap: 6px;">
      <div style="border-radius: 8px; background: #1f1f29; padding: 8px 12px; font-size: 15px; font-weight: 600; color: #f2f2f5;">이름순</div>
      <div style="border-radius: 8px; padding: 8px 12px; font-size: 15px; color: #a1a1ae;">최저가순</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px;">
    <div style="border-radius: 16px; border: 1px solid #2c2c38; background: #16161d; padding: 16px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div style="font-size: 18px; font-weight: 700;">아람</div>
        <div style="font-size: 15px; color: #a1a1ae;">대학로</div>
      </div>
      <div style="margin-top: 8px; font-size: 15px; color: #f2f2f5;"><span style="margin-right: 6px; color: #e8b45c;">시그니처</span>피치 못할 사랑<span style="margin-left: 8px; font-weight: 600;">15,000원</span></div>
      <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px;">
        <div style="border-radius: 6px; background: rgba(232,180,92,0.15); padding: 4px 8px; font-size: 15px; color: #e8b45c;">입문자 추천</div>
        <div style="border-radius: 6px; background: #1f1f29; padding: 4px 8px; font-size: 15px; color: #a1a1ae;">클래식 바</div>
      </div>
      <div style="margin-top: 12px; font-size: 15px; line-height: 1.55; color: #a1a1ae;">구정문을 대표하는 몰트바의 정석</div>
    </div>

    <div style="border-radius: 16px; border: 1px solid #2c2c38; background: #16161d; padding: 16px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div style="font-size: 18px; font-weight: 700;">공백</div>
        <div style="font-size: 15px; color: #a1a1ae;">대학로</div>
      </div>
      <div style="margin-top: 8px; font-size: 15px; color: #f2f2f5;">파우스트<span style="margin-left: 8px; font-weight: 600;">14,000원</span></div>
      <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px;">
        <div style="border-radius: 6px; background: #1f1f29; padding: 4px 8px; font-size: 15px; color: #a1a1ae;">캐쥬얼 바</div>
      </div>
      <div style="margin-top: 12px; font-size: 15px; line-height: 1.55; color: #a1a1ae;">잠시 쉬어갈 수 있는 [공 백]을 나타낸 캐쥬얼 바</div>
    </div>

    <div style="border-radius: 16px; border: 1px solid #2c2c38; background: #16161d; padding: 16px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div style="font-size: 18px; font-weight: 700;">그리즐리</div>
        <div style="font-size: 15px; color: #a1a1ae;">대학로</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
