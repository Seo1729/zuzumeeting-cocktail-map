<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
    body { margin: 0; }
    a { color: #e8b45c; }
    a:hover { color: #f0c479; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0b0b0f; color: #f2f2f5; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;">

  <!-- 뒤로가기: 화살표만 있던 자리에 어디로 돌아가는지 남긴다. -->
  <div style="display: flex; align-items: center; height: 48px; padding: 0 8px;">
    <div style="display: flex; align-items: center; gap: 6px; border-radius: 9px; padding: 9px 12px; font-size: 15px; color: #a1a1ae;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a1a1ae" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      목록
    </div>
  </div>

  <div style="padding: 4px 16px 0 16px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #e8b45c;"></span>
      <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.04em; color: #9c9caa;">대학로</div>
    </div>
    <div style="margin-top: 6px; font-size: 30px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.12;">아람</div>
  </div>

  <!-- 한 줄 평: 카카오맵에 없는 유일한 정보라 가장 크게 둔다. 인용부호로 사람 말임을 드러낸다. -->
  <div style="margin: 16px 16px 0 16px; position: relative; border-radius: 18px; border: 1px solid rgba(232,180,92,0.32); background: linear-gradient(180deg, rgba(232,180,92,0.13) 0%, rgba(232,180,92,0.06) 100%); padding: 15px 16px 16px 16px;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="{{accent}}"><path d="M9.5 5.5C6.4 6.9 4.5 9.6 4.5 12.8v5.7h6.4v-6.4H7.7c0-1.9 1-3.4 2.9-4.3zm9.9 0c-3.1 1.4-5 4.1-5 7.3v5.7h6.4v-6.4h-3.2c0-1.9 1-3.4 2.9-4.3z"></path></svg>
      <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.03em; color: {{accent}};">운영진 한 줄 평</div>
    </div>
    <div style="margin-top: 9px; font-size: 19px; font-weight: 600; line-height: 1.5; letter-spacing: -0.015em; color: #f6f2ea;">구정문을 대표하는 몰트바의 정석</div>
  </div>

  <!-- 태그를 정보표 위로 올린다. 성격을 먼저 알고 주소를 보는 순서가 자연스럽다. -->
  <div style="margin: 14px 16px 0 16px; display: flex; flex-wrap: wrap; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 5px; border-radius: 8px; background: rgba(232,180,92,0.14); padding: 6px 10px; font-size: 15px; font-weight: 600; color: {{accent}};">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.3 5.6.7-4.2 3.9 1.1 5.6L12 15.8 7.1 18.5l1.1-5.6L4 9l5.6-.7z"></path></svg>
      입문자 추천
    </div>
    <div style="border-radius: 8px; background: #23232e; padding: 6px 10px; font-size: 15px; color: #9c9caa;">클래식 바</div>
  </div>

  <!-- 정보표: 라벨을 작게 눕히고 값을 왼쪽으로 당겨 두 열이 흔들리지 않게 한다. -->
  <div style="margin: 16px 16px 0 16px; border-radius: 16px; border: 1px solid #23232e; background: #131318; padding: 4px 14px;">
    <div style="display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #1f1f28;">
      <div style="width: 62px; flex-shrink: 0; font-size: 15px; color: #7e7e8c;">주소</div>
      <div style="font-size: 15px; color: #e4e4ea;">전북 전주시 덕진구 권삼득로 309-1 2층</div>
    </div>
    <div style="display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #1f1f28;">
      <div style="width: 62px; flex-shrink: 0; font-size: 15px; color: #7e7e8c;">영업시간</div>
      <div style="font-size: 15px; color: #e4e4ea; font-variant-numeric: tabular-nums;">18:30 – 01:30</div>
    </div>
    <div style="display: flex; gap: 12px; padding: 11px 0;">
      <div style="width: 62px; flex-shrink: 0; font-size: 15px; color: #7e7e8c;">휴무일</div>
      <div style="font-size: 15px; color: #e4e4ea;">공휴일</div>
    </div>
  </div>

  <div style="margin: 20px 16px 0 16px; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em;">메뉴</div>
    <div style="font-size: 15px; color: #8d8d9b;"><span style="color: #e4e4ea; font-weight: 700;">108</span>개</div>
  </div>

  <div style="margin: 11px 16px 0 16px;">
    <div style="position: relative; display: flex; align-items: center; border-radius: 13px; border: 1px solid #2c2c38; background: #16161d; box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); padding: 0 13px; height: 46px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7e7e8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <div style="margin-left: 9px; font-size: 16px; color: #7e7e8c;">메뉴, 재료, 기주로 검색</div>
    </div>
  </div>

  <div style="margin: 6px 16px 0 16px;">
    <div style="display: flex; align-items: baseline; gap: 10px; padding: 13px 0; border-bottom: 1px solid #1f1f28;">
      <div style="min-width: 0;">
        <div style="display: flex; align-items: baseline; gap: 7px;">
          <span style="flex-shrink: 0; border-radius: 5px; background: {{accent}}; color: #2a1d06; padding: 2px 6px; font-size: 15px; font-weight: 700;">시그니처</span>
          <span style="font-size: 16px; font-weight: 600; color: #f2f2f5;">피치 못할 사랑</span>
        </div>
        <div style="margin-top: 4px; font-size: 15px; color: #8d8d9b;">리큐르</div>
      </div>
      <div style="margin-left: auto; flex-shrink: 0; font-size: 16px; font-weight: 700; color: {{accent}}; font-variant-numeric: tabular-nums;">15,000원</div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 10px; padding: 13px 0; border-bottom: 1px solid #1f1f28;">
      <div style="min-width: 0;">
        <div style="font-size: 16px; font-weight: 600; color: #f2f2f5;">깔루아 밀크</div>
        <div style="margin-top: 4px; font-size: 15px; color: #8d8d9b;">리큐르 · <span style="color: #a5a5b2;">도수 5%</span> · 깔루아, 우유</div>
      </div>
      <div style="margin-left: auto; flex-shrink: 0; font-size: 16px; font-weight: 700; color: #e4e4ea; font-variant-numeric: tabular-nums;">12,000원</div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 10px; padding: 13px 0;">
      <div style="min-width: 0;">
        <div style="font-size: 16px; font-weight: 600; color: #f2f2f5;">동해</div>
        <div style="margin-top: 4px; font-size: 15px; color: #8d8d9b;">리큐르 · <span style="color: #a5a5b2;">도수 6%</span> · 피치트리, 블루 큐라소…</div>
      </div>
      <div style="margin-left: auto; flex-shrink: 0; font-size: 16px; font-weight: 700; color: #e4e4ea; font-variant-numeric: tabular-nums;">12,000원</div>
    </div>
  </div>

  <!-- 하단 고정 바. 카카오를 채운 버튼으로, 네이버를 테두리 버튼으로 둬 기본을 명확히 한다. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #2c2c38; background: rgba(22,22,29,0.97); backdrop-filter: blur(12px); padding: 11px 12px 14px 12px;">
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 14px; background: {{accent}}; color: #2a1d06; height: 52px; font-size: 16px; font-weight: 700; white-space: nowrap;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2a1d06" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.7 7-11a7 7 0 10-14 0c0 5.3 7 11 7 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg>
        카카오맵 길찾기
      </div>
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 14px; border: 1px solid #363644; background: #1b1b24; color: #e4e4ea; height: 52px; font-size: 16px; font-weight: 600; white-space: nowrap;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e4e4ea" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.7 7-11a7 7 0 10-14 0c0 5.3 7 11 7 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg>
        네이버 길찾기
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#e8b45c","options":["#e8b45c","#d9a441","#c9a227","#e0b877"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#e8b45c' };
  }
}
</script>
</body>
</html>
